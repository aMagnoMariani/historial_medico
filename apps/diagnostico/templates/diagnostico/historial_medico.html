{% extends 'base.html' %}
{% block content %}
<div class="container-fluid">
<div class="d-flex justify-content-between align-items-center mb-4">
<h2 class="fw-bold"> Historial Médico</h2>
</div>

<div class="card card-custom p-4 mb-4">
<div class="row g-3">
<div class="col-md-4">
<label class="form-label small fw-bold">Buscar por Cédula del Paciente</label>
<input type="text" id="searchCedula" class="form-control" placeholder="Número de cédula...">
</div>
<div class="col-md-4">
<label class="form-label small fw-bold">Fecha de Atención</label>
<input type="date" id="searchFecha" class="form-control">
</div>
<div class="col-md-4">
<label class="form-label small fw-bold">Estado de Cita</label>
<select id="searchEstado" class="form-select">
<option value="">Todos</option>
<option value="En espera">En espera</option>
<option value="Atendido">Atendido</option>
<option value="Cancelada">Cancelada</option>
</select>
</div>
</div>
</div>

<div class="card card-custom p-4">
<div class="table-responsive">
<table class="table table-hover align-middle">
<thead class="table-light">
<tr>
<th>ID Consulta</th>
<th>Paciente</th>
<th>Cédula</th>
<th>Médico</th>
<th>Fecha</th>
<th>Tipo</th>
<th>Estado</th>
</tr>
</thead>
<tbody id="historialBody">
</tbody>
</table>
</div>
</div>
</div>

<script>
const API_URL = "{% url 'diagnostico:api_buscar_historial' %}";
const tbody = document.getElementById('historialBody');

function renderData(data){
tbody.innerHTML = '';
if(data.length === 0){
tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Sin resultados</td></tr>';
return;
}
data.forEach(r => {
const tr = document.createElement('tr');
tr.innerHTML = `
<td>${r.id}</td>
<td>${r.paciente}</td>
<td>${r.cedula}</td>
<td>${r.medico}</td>
<td>${r.fecha_atencion}</td>
<td>${r.tipo_consulta}</td>
<td><span class="badge ${r.estado === 'En espera' ? 'bg-warning' : r.estado === 'Atendido' ? 'bg-success' : 'bg-danger'}">${r.estado}</span></td>
`;
tbody.appendChild(tr);
});
}

async function fetchData(){
const q = document.getElementById('searchCedula').value;
const fecha = document.getElementById('searchFecha').value;
const estado = document.getElementById('searchEstado').value;
const params = new URLSearchParams();
if(q) params.append('q', q);
if(fecha) params.append('fecha', fecha);
if(estado) params.append('estado', estado);
const res = await fetch(`${API_URL}?${params.toString()}`);
const data = await res.json();
renderData(data);
}

fetchData();
['searchCedula','searchFecha','searchEstado'].forEach(id=>{
document.getElementById(id).addEventListener('input', ()=>{
clearTimeout(window.t);
window.t = setTimeout(fetchData, 300);
});
});
</script>
{% endblock %}
