{% extends 'base.html' %}
{% block content %}
<div class="container-fluid">
    <h2 class="fw-bold mb-4">📚 Catálogo de Enfermedades</h2>
    <div class="card card-custom p-4">
        <form method="post" class="mb-4">
            {% csrf_token %}
            <input type="hidden" name="action" value="crear">
            <div class="row g-3">
                <div class="col-md-5"><input name="dsc" class="form-control" placeholder="Descripción enfermedad" required></div>
                <div class="col-md-3"><input name="depid" class="form-control" placeholder="ID padre opcional"></div>
                <div class="col-md-2"><input name="tipo" class="form-control" placeholder="Tipo"></div>
                <div class="col-md-2 text-end"><button class="btn btn-corporate">Guardar</button></div>
            </div>
        </form>
        <table class="table table-hover">
            <thead><tr><th>ID</th><th>Descripción</th><th>Padre ID</th><th>Tipo</th></tr></thead>
            <tbody>
                {% for e in catalogo %}
                <tr><td>{{ e.id }}</td><td>{{ e.dsc }}</td><td>{{ e.depid_id|default:'-' }}</td><td>{{ e.tipo|default:'-' }}</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
